# AutoShorts Studio — CasaOS kurulum sablonu, PAKET ICI PostgreSQL (Raspberry Pi 5, ARM64)
#
# Bu varyant kendi izole postgres:17 konteynerini kurar (paylasilan
# sunucuya dokunmaz). Veri: /DATA/AppData/autoshorts-studio/pgdata
#
# KULLANIM: Asagidaki __GENERATED_PASSWORD__ yazan IKI yeri, taze uretilmis
# guclu bir sifreyle degistirin, sonra bu dosyanin tamamini CasaOS'a
# yapistirin. Sifre uretimi:  openssl rand -hex 24
#
# Harici PostgreSQL (Pi'de zaten calisan sunucu) kullanmak isterseniz
# docker-compose.external-db.yml dosyasina bakin.
#
# Gelistirici notu: yerel imajlar (pull_policy: never), sadece frontend
# portu disari acik.

# Docker Compose proje adi ve CasaOS uygulama karti bilgileri.
name: autoshorts-studio

x-casaos:
  appstore:
    icon: https://raw.githubusercontent.com/muratcihanyandi/autoshorts-studio-v2/main/deploy/casaos/autoshorts-icon.png
    title: AutoShorts Studio
    port_map: "8080"

services:
  frontend:
    image: autoshorts-studio-frontend:local
    platform: linux/arm64
    pull_policy: never
    container_name: autoshorts-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - autoshorts-net

  postgres:
    image: postgres:17-alpine
    platform: linux/arm64
    container_name: autoshorts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: autoshorts
      POSTGRES_PASSWORD: __GENERATED_PASSWORD__
      POSTGRES_DB: autoshorts_studio
    volumes:
      - /DATA/AppData/autoshorts-studio/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoshorts -d autoshorts_studio"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - autoshorts-net

  backend:
    image: autoshorts-studio-backend:local
    platform: linux/arm64
    pull_policy: never
    container_name: autoshorts-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgresql+asyncpg://autoshorts:__GENERATED_PASSWORD__@postgres:5432/autoshorts_studio
      # Otomasyon motoru: worker'i acar (kapaliysa motor hic baslamaz).
      WORKER_ENABLED: "true"
      # Etiketli medya agaci: downloads / edited / clips / stock / tmp.
      MEDIA_ROOT: /data/media
    volumes:
      - /mnt/usb/Autoshorts_Studio:/data/media
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - autoshorts-net

networks:
  autoshorts-net:
    name: autoshorts-net
