name: build-images

# Builds and publishes the backend and frontend images to GHCR:
#   ghcr.io/<owner>/<repo>/backend:latest  (+ :sha-<commit>)
#   ghcr.io/<owner>/<repo>/frontend:latest (+ :sha-<commit>)
#
# linux/arm64 is built via QEMU emulation on the standard runner (slow but
# works on every plan; a native arm64 runner would speed this up).
# After the first run, make the packages public (package settings ->
# visibility) or run `docker login ghcr.io` on the Pi for private pulls.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image prefix
        id: prep
        run: |
          echo "prefix=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.prep.outputs.prefix }}/backend:latest
            ${{ steps.prep.outputs.prefix }}/backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.prep.outputs.prefix }}/frontend:latest
            ${{ steps.prep.outputs.prefix }}/frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
